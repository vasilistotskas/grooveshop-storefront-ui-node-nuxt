name: CI

on:
  push:
    branches: ['main']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.editorconfig'
  pull_request:
    branches: ['main']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.editorconfig'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SYSTEM_ENV: ci

jobs:
  security-scan:
    name: Security Scan (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run Trivy filesystem scan
        # SHA-pinned: trivy-action's mutable tags were hijacked in the
        # 2026-03 supply-chain incident, so tags are not trusted.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: sarif
          output: trivy-results.sarif
          skip-dirs: node_modules,dist,.output,.nuxt
          limit-severities-for-sarif: true
          trivyignores: .trivyignore

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif

  # The former monolithic "Quality, Test & Build" job is split into
  # quality / test / e2e / build so the critical path is the slowest
  # job (~5 min) instead of their sum (~8.5 min). Each job re-pays
  # ~1 min of checkout+install (pnpm store cached), which the
  # parallelism buys back several times over.
  quality:
    name: Typecheck & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare Nuxt
        run: pnpm run prepare

      - name: Verify dependency signatures
        run: pnpm audit signatures --audit-level=critical
        continue-on-error: true

      # ``nuxt typecheck`` is the documented gate (stricter than
      # ``vue-tsc --noEmit``, which CI previously ran non-blocking).
      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint:ci

  test:
    name: Unit & Nuxt Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:8-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare Nuxt
        run: pnpm run prepare

      - name: Run tests with coverage
        run: pnpm run test:ci
        env:
          NODE_ENV: test
          CI: true

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            echo "## Coverage Report" >> $GITHUB_STEP_SUMMARY
            node -e "
              const fs = require('fs');
              const s = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8')).total;
              console.log('| Metric | Coverage | Covered / Total |');
              console.log('|--------|----------|-----------------|');
              console.log(\`| Statements | \${s.statements.pct}% | \${s.statements.covered} / \${s.statements.total} |\`);
              console.log(\`| Branches   | \${s.branches.pct}% | \${s.branches.covered} / \${s.branches.total} |\`);
              console.log(\`| Functions  | \${s.functions.pct}% | \${s.functions.covered} / \${s.functions.total} |\`);
              console.log(\`| Lines      | \${s.lines.pct}% | \${s.lines.covered} / \${s.lines.total} |\`);
            " >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  e2e:
    name: E2E Regression Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare Nuxt
        run: pnpm run prepare

      # Boots a real Nitro dev server to prove SWR background revalidation
      # forwards the correct per-tenant X-Forwarded-Host (cross-tenant
      # isolation invariant — see test/e2e/tenant-swr-host-propagation.spec.ts).
      # Kept separate from test:ci because it spawns a server process and does
      # not participate in coverage. Uses an in-memory cache, so it needs no
      # Redis service.
      - name: Run e2e regression tests
        run: pnpm run test:e2e
        env:
          NODE_ENV: test
          CI: true

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:8-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # SECURITY: no real secret may enter this build. `pnpm run build` bakes
      # runtimeConfig defaults into `.output`. Real values are supplied
      # ONLY at runtime by the K8s sealed secret; the placeholders below are
      # overridden there. See docker.yml for the same rationale.
      - name: Create .env file (public build config + placeholder secrets)
        env:
          ALL_VARS: ${{ toJSON(vars) }}
        run: |
          # GitHub *variables* (not secrets) — non-sensitive NUXT_* build/public config only.
          echo "$ALL_VARS" | jq -r 'to_entries | .[] | select(.key | startswith("NUXT_")) | "\(.key)=\(.value)"' > .env
          echo "NUXT_REDIS_HOST=localhost" >> .env
          echo "NUXT_REDIS_PORT=6379" >> .env
          # Build-only placeholders so the prerender-time startup-validation
          # Nitro plugin passes (session password >=32 chars + secret key present).
          echo "NUXT_SESSION_PASSWORD=build-only-placeholder-overridden-at-runtime-00" >> .env
          echo "NUXT_SECRET_KEY=build-only-placeholder-overridden-at-runtime" >> .env

      # The built ``.output`` is deliberately NOT uploaded anywhere: the
      # deployable is the Docker image built by docker.yml, which builds
      # from source. This job only proves the build works.
      - name: Build application
        run: pnpm run build
        env:
          NODE_ENV: production

  schema-freshness:
    name: OpenAPI Schema Freshness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Regenerate OpenAPI types
        run: pnpm openapi-ts

      - name: Check for drift in generated TypeScript files
        run: |
          if ! git diff --exit-code shared/openapi/; then
            echo ""
            echo "ERROR: Generated OpenAPI TypeScript files are out of date."
            echo "Run 'pnpm openapi-ts' locally and commit the updated files in shared/openapi/."
            exit 1
          fi

      - name: Sync schema YAML files from schema.json
        run: pnpm sync:schema

      - name: Check for drift in schema YAML files
        run: |
          drift=0
          if ! git diff --exit-code openapi/schema.yml; then
            echo ""
            echo "ERROR: openapi/schema.yml is out of sync with openapi/schema.json."
            drift=1
          fi
          if ! git diff --exit-code schema.yml; then
            echo ""
            echo "ERROR: schema.yml (root) is out of sync with openapi/schema.json."
            drift=1
          fi
          if [ "$drift" -eq 1 ]; then
            echo ""
            echo "Run 'pnpm sync:schema' locally and commit the updated YAML files."
            exit 1
          fi

  release:
    name: Release
    needs: [security-scan, quality, test, e2e, build, schema-freshness]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency: release
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.NUXT_TOKEN }}

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # No release assets: the deployable is the Docker image built by
      # docker.yml on the published release. The old ``.output`` asset
      # config never worked (semantic-release logged "cannot be read,
      # will be ignored" on every release) and nothing missed it.
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.NUXT_TOKEN }}
        run: pnpm run semantic-release
