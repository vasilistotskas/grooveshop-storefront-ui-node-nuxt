name: Publish Docker image

on:
  release:
    types: [published]
  # Branch builds for the multi-tenant staging dry-run: semantic-release
  # only cuts versions on main, so images off other branches are minted
  # by dispatching this workflow on the branch ref with an explicit tag
  # (e.g. vX.Y.Z-mt.1).
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Explicit image tag for branch builds (e.g. v1.2.3-mt.1)"
        required: true
        type: string

env:
  SYSTEM_ENV: ci

jobs:
  push_to_registries:
    name: Push Docker image to multiple registries
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      packages: write
      contents: read
      security-events: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # SECURITY: no real secret may enter the build context. `nuxt build`
      # bakes runtimeConfig defaults into `.output`, and the production image
      # ships `.output` — so any real secret written here would be extractable
      # from the published (public) image. Real values (NUXT_SESSION_PASSWORD,
      # NUXT_SECRET_KEY, OAuth client secrets) are supplied ONLY at runtime by
      # the K8s sealed secret, which overrides the baked placeholders below.
      - name: Create .env file (public build config + placeholder secrets)
        env:
          ALL_VARS: ${{ toJSON(vars) }}
        run: |
          # GitHub *variables* (not secrets) — non-sensitive NUXT_* build/public config only.
          echo "$ALL_VARS" | jq -r 'to_entries | .[] | select(.key | startswith("NUXT_")) | "\(.key)=\(.value)"' > .env
          echo "NUXT_CACHE_BASE=memory" >> .env
          # Build-only placeholders: the prerender-time startup-validation Nitro
          # plugin requires NUXT_SESSION_PASSWORD (>=32 chars) and NUXT_SECRET_KEY
          # to be present. These dummy values are intentionally NOT secrets and
          # are overridden by the real K8s env vars at runtime.
          echo "NUXT_SESSION_PASSWORD=build-only-placeholder-overridden-at-runtime-00" >> .env
          echo "NUXT_SECRET_KEY=build-only-placeholder-overridden-at-runtime" >> .env
          echo "=== .env file created (keys only) ==="
          cut -d'=' -f1 .env

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            gro0ve/grooveshop-storefront-ui-node-nuxt
            ghcr.io/${{ github.repository }}
          # Releases keep the default tag derivation (the release tag);
          # dispatched branch builds use the explicit input tag only.
          tags: |
            type=ref,event=tag
            type=raw,value=${{ inputs.image_tag }},enable=${{ github.event_name == 'workflow_dispatch' }}

      # Single build+push, then scan the pushed image. The Trivy scan
      # is informational (``exit-code: '0'``), so scanning before the
      # push protected nothing — the old build-twice shape (local load
      # for scanning, then push) only duplicated the image export and
      # cost ~3 min per release.
      - name: Build and push Docker images
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          target: production
          build-args: |
            NODE_VERSION=24.19.0
          sbom: true
          provenance: mode=max

      - name: Run Trivy image scan
        # SHA-pinned: trivy-action's mutable tags were hijacked in the
        # 2026-03 supply-chain incident, so tags are not trusted.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          severity: HIGH,CRITICAL
          # Don't gate the publish on image CVEs. Trivy uploads the
          # SARIF to the GitHub Security tab, so findings remain
          # visible and triageable, but transient base-image CVEs
          # don't block a release. ``ignore-unfixed`` doesn't help
          # here because the Trivy CLI still exits non-zero on
          # findings even when SARIF is filtered.
          ignore-unfixed: true
          exit-code: '0'
          format: sarif
          output: trivy-image-results.sarif
          limit-severities-for-sarif: true

      - name: Upload Trivy image scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-image-results.sarif
