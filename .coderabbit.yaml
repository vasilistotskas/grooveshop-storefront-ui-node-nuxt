# yaml-language-server: $schema=https://www.coderabbit.ai/integrations/schema.v2.json
#
# CodeRabbit reviews this repository on its free open-source tier: 1 to 10 pull
# request reviews an hour depending on the repository's stars, for each author
# and separately for each repository (https://docs.coderabbit.ai/management/plans;
# each review's "Review info" shows what is left), and every push counts as a
# review. So a pull request is reviewed when it is opened or marked ready (drafts
# wait), and again only when its author comments `@coderabbitai review`. Ask the
# same way if no review starts (the plans page says repositories under 10 stars
# need a manual trigger) or if a push drops a review in progress.
#
# `inheritance: true` lets settings made in the CodeRabbit app fill in what this
# file leaves out. `@coderabbitai configuration` on a pull request shows what
# applies and where each value comes from.
inheritance: true
reviews:
  auto_review:
    auto_incremental_review: false
    # The draft-first rule saves reviews only while drafts are skipped, so this
    # is stated here rather than left to a default.
    drafts: false
