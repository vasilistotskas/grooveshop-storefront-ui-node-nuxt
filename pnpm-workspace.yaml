overrides:
  # All overrides live here — pnpm 11 silently ignores
  # `pnpm.overrides` in package.json. Pin via `<vulnerable':
  # '>=patched'` so a future native bump is still allowed once
  # all consumers catch up.

  # CVE-2026-42570 — prototype pollution in devalue <5.8.1.
  # Transitively via @nuxtjs/i18n, nuxt-og-image, @nuxt/hints,
  # Nitro server.
  'devalue@<5.8.1': '>=5.8.1'

  # CVE-2026-14257 (≤5.0.7) and CVE-2026-69152 (≤5.0.8) — ReDoS in
  # brace-expansion; 5.0.9 patches both (per-major fixes 1.1.18/2.1.4/
  # 3.0.6 exist for 69152, but this override already collapses every
  # major onto 5.x). 5.x ships dual CJS+ESM with the same ``expand()``
  # API, so forcing the minimatch/glob chain up is safe. Capped <6 so
  # a future major needs a deliberate bump (undici lesson: unbounded
  # overrides break transitive consumers).
  'brace-expansion@<5.0.9': '>=5.0.9 <6'

  # GHSA-f88m-g3jw-g9cj — sharp, patched in 0.35.0. The old
  # "don't override sharp" note is obsolete: @nuxt/image v2
  # dropped the legacy ipx sharp 0.32.6, and the tree already
  # ships a clean 0.35.3 branch, so collapsing the vulnerable
  # 0.34.x branch (nuxt-og-image — module disabled anyway) onto
  # 0.35 carries no extra runtime surface.
  'sharp@>=0.34.0 <0.35.0': '>=0.35.0'

  # Mar-2026 cluster: GHSA-q67f-28xg-22rw (Ed25519 forgery),
  # GHSA-ppp5-5v6c-4jwp (RSA-PKCS forgery), GHSA-5m6q-g25r-mvwx
  # (modInverse DoS). All fixed in node-forge@1.4.0.
  node-forge: '>=1.4.0'

  # GHSA-c2c7-rcm5-vvqj (extglob ReDoS) +
  # GHSA-3v7f-55p6-f55p (POSIX class injection). Patched in
  # 2.3.2 on the dormant v2 line and 4.0.4 on the active line.
  'picomatch@<2.3.2': '>=2.3.2'
  'picomatch@<4.0.4': '>=4.0.4'

  # CVE-2026-4800 (_.template injection), CVE-2026-2950 +
  # CVE-2025-13465 (prototype pollution). lodash quietly resumed
  # publishing in 2025 — 4.18.0 is the patch floor.
  lodash: '>=4.18.0'

  # GHSA-hffm-xvc3-vprc (RCE) + GHSA-jcxm-m3jx-f287
  # (option-parse command injection).
  simple-git: '>=3.36.0'

  # GHSA-5wm8-gmm8-39j9 (attribute-quote bypass) +
  # GHSA-45c6-75p6-83cc (comment regex bypass).
  fast-xml-builder: '>=1.1.7'

  # NEW — was missing from the legacy package.json overrides.
  # Tree currently has fast-xml-parser@5.5.11 via @nuxtjs/sitemap
  # → @nuxtjs/seo. GHSA-gh4j-gqv2-49f6 + GHSA-fj3w-jwp8-x2g3
  # patched in 5.7.0.
  fast-xml-parser: '>=5.7.0'

  # CVE-2026-59869 (patched 4.3.0) + GHSA-5p4m-2wfm-xmqj (prototype
  # pollution, patched 4.3.1) — js-yaml. Supersedes the old
  # registry-yank exact pin `js-yaml: 4.1.1`: 4.3.x has since been
  # republished (v4-legacy dist-tag), so the floor also absorbs
  # @hey-api/json-schema-ref-parser's exact js-yaml@4.2.0 pin (still
  # unpublished). Capped <5 to keep consumers off the js-yaml 5 API
  # line.
  'js-yaml@<4.3.1': '>=4.3.1 <5'

  # CVE-2026-48779 — ws DoS, patched in 8.21.0 on the 8.x line.
  'ws@<8.21.0': '>=8.21.0'

  # CVE-2026-53571 — vite, patched in 7.3.5 on the 7.x line
  # (8.1.0 is already above the 8.0.16 floor).
  'vite@<7.3.5': '>=7.3.5'

  # CVE-2026-9697, CVE-2026-6734, CVE-2026-12151 — undici 7.x
  # patched in 7.28.0. Capped at <8 because jsdom 29 deep-imports
  # undici/lib/handler/wrap-handler.js, which undici 8.0 removed —
  # bumping jsdom's copy to 8.x breaks the test env. The safe 6.x
  # and the pre-existing 8.x copies are untouched.
  'undici@>=7.0.0 <7.28.0': '>=7.28.0 <8'

  # CVE-2026-9277 — shell-quote, patched in 1.8.4.
  'shell-quote@<1.8.4': '>=1.8.4'

  # CVE-2026-59873 (CRITICAL) + CVE-2026-59874 — tar 7.x, both
  # patched by 7.5.19.
  'tar@>=7.0.0 <7.5.19': '>=7.5.19'

  # CVE-2026-13149 — brace-expansion ReDoS, patched in 1.1.16 /
  # 2.1.2 / 5.0.7 per line. Tree ships the 2.x and 5.x lines.
  'brace-expansion@>=2.0.0 <2.1.2': '>=2.1.2 <3'
  'brace-expansion@>=5.0.0 <5.0.7': '>=5.0.7'

  # GHSA-2p49-hgcm-8545 — svgo, patched in 4.0.2 on the 4.x line.
  'svgo@>=4.0.0 <4.0.2': '>=4.0.2'
allowBuilds:
  '@intlify/vue-i18n-bridge': true
  '@intlify/vue-router-bridge': true
  '@parcel/watcher': true
  better-sqlite3: true
  esbuild: true
  sharp: true
  unrs-resolver: true
  vue-demi: true
